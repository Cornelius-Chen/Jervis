              const: not_authorized
          required:
          - status
          additionalProperties: false
        - type: object
          properties:
            status:
              const: pending_transition
            derivation_rule:
              const: unique_single_parent_direct_child_matching_bound_manifest
            baseline_rule:
              const: derived_transition_commit_is_next_phase_baseline
            transition_manifest:
              type: array
              items:
                type: object
                properties:
