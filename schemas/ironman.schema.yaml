      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
