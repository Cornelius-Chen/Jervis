    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - verification_id
    - task_id
    - artifact_refs
    - acceptance_test_results
    - overall_status
    - verifier_actor
    - verified_at
    - independence_statement
    additionalProperties: false
  Artifact:
    type: object
    properties:
      object_id: *id001
