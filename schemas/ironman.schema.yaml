      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      project_id: *id001
      objectives:
        type: array
        items: *id001
        minItems: 1
      constraints:
        type: array
        items: *id001
      terminology:
