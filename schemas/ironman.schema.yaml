                        - add
                        - modify
                    required:
                    - change_type
                  then:
                    required:
                    - sha256_after
                - if:
                    properties:
                      change_type:
                        const: delete
                    required:
                    - change_type
                  then:
                    not:
                      required:
                      - sha256_after
