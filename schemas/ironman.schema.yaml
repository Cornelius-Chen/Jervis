    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - artifact_id
    - artifact_kind
    - uri
    - content_hash
    - producer_trace_ref
    - retention_class
    additionalProperties: false
  HumanIntervention:
