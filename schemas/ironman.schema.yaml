      uri: *id001
      producer_trace_ref: *id003
      acceptance_contract_ref:
        type: string
      verification_ref:
        type: string
      reproducibility_refs:
        type: array
        items: *id001
      retention_class:
        type: string
        enum:
        - ephemeral
