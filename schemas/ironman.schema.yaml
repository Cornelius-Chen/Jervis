$schema: https://json-schema.org/draft/2020-12/schema
$id: https://local.ironman/schemas/ironman.schema.yaml
title: IRONMAN Canonical Contracts
description: Canonical machine-readable contracts for IRONMAN v1.2. All per-object wrapper schemas reference this file.
$defs:
  ObjectEnvelope:
    type: object
    properties:
      object_id: &id001
        type: string
        minLength: 1
      object_type: *id001
      human_name: &id004
        type: string
      version: &id005
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$
      semantic_owner: *id001
      lifecycle_state: &id006
        type: string
        enum:
        - raw
        - quarantine
        - candidate
        - accepted
        - stable
        - canonical
        - deprecated
        - retired
        - rejected
      created_at: &id002
        type: string
        format: date-time
      created_by: *id001
      updated_at: *id002
      provenance_refs: &id007
        type: array
        items: &id003
          type: string
          minLength: 1
      parent_ids: &id008
        type: array
        items: *id003
        uniqueItems: true
      root_origin_id: *id003
      tags: &id009
        type: array
        items:
          type: string
        uniqueItems: true
      visibility: &id010
        type: string
        enum:
        - private
        - restricted
        - project
        - shared
      content_ref: &id011
        type: string
      content_hash: &id013
        type: string
      status_reason: &id012
        type: string
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    additionalProperties: true
    description: Common immutable identity and lifecycle envelope.
  SourceEvidence:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id001
      status_reason: *id012
      source_type:
        type: string
        enum:
        - webpage
        - video
        - audio
        - image
        - repo
        - paper
        - post
        - book
        - conversation
        - dataset
        - product
        - other
      source_locator: *id001
      creator_or_org:
        type: string
      published_at: *id002
      captured_at: *id002
      version_or_commit:
        type: string
      usage_status:
        type: string
        enum:
        - unknown
        - review_required
        - permitted
        - restricted
        - prohibited
      license:
        type: string
      discovery_reason: *id001
      discovery_channel: *id001
      raw_content_ref: *id001
      freshness_review_at: *id002
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - source_type
    - source_locator
    - captured_at
    - usage_status
    - discovery_reason
    - discovery_channel
    - raw_content_ref
    - content_hash
    additionalProperties: false
  Capability:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      job_to_be_done: *id001
      task_families:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
      applies_when:
        type: array
        items: &id014
          type: object
          properties:
            field: *id001
            operator:
              type: string
              enum:
              - eq
              - neq
              - in
              - not_in
              - gt
              - gte
              - lt
              - lte
              - exists
              - matches
              - custom
            value: {}
          required:
          - field
          - operator
          additionalProperties: false
        minItems: 1
      fails_when:
        type: array
        items: *id014
        minItems: 1
      input_contract:
        type: string
      output_contract:
        type: string
      required_context:
        type: array
        items: *id001
        uniqueItems: true
      required_tools:
        type: array
        items: *id003
        uniqueItems: true
      model_preferences:
        type: array
        items: *id001
        uniqueItems: true
      permission_scope:
        type: array
        items: *id001
        uniqueItems: true
      eval_suite_refs:
        type: array
        items: *id003
        minItems: 1
        uniqueItems: true
      performance_profile:
        type: object
      known_failure_modes:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
      conflicts_with:
        type: array
        items: *id003
        uniqueItems: true
      cost_profile:
        type: object
      latency_profile:
        type: object
      last_verified_at: *id002
      last_used_at: *id002
      usage_count:
        type: integer
        minimum: 0
      rollback_target:
        type: string
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - job_to_be_done
    - task_families
    - applies_when
    - fails_when
    - input_contract
    - output_contract
    - eval_suite_refs
    - known_failure_modes
    additionalProperties: false
  Relation:
    type: object
    properties:
      edge_id: *id001
      source_id: *id003
      relation_type:
        type: string
        enum:
        - derived_from
        - supports
        - contradicts
        - abstracts
        - generalizes
        - specializes
        - requires
        - composes_with
        - applies_to
        - fails_when
        - supersedes
        - validated_by
        - used_in
        - correlated_with_success
        - contributed_to
        - caused_improvement
        - blocked_by
        - produced
      target_id: *id003
      confidence:
        type: number
        minimum: 0
        maximum: 1
      created_at: *id002
      created_by: *id001
      provenance_refs:
        type: array
        items: *id003
        minItems: 1
      valid_from: *id002
      valid_to: *id002
      notes:
        type: string
    required:
    - edge_id
    - source_id
    - relation_type
    - target_id
    - created_at
    - created_by
    - provenance_refs
    additionalProperties: false
  TaskContract:
    type: object
    properties:
      task_id: *id001
      mission_id:
        type: string
      goal: *id001
      primary_domain: *id001
      support_domains:
        type: array
        items: *id001
        uniqueItems: true
      task_family: *id001
      task_stage:
        type: string
      inputs:
        type: object
      required_outputs:
        type: array
        items:
          type: object
          properties:
            name: *id001
            schema_ref:
              type: string
            required:
              type: boolean
          required:
          - name
          additionalProperties: false
        minItems: 1
      hard_constraints:
        type: array
        items: *id001
      soft_preferences:
        type: array
        items: *id001
      anti_patterns:
        type: array
        items: *id001
      required_evidence:
        type: array
        items: *id001
      privacy_level:
        type: string
        enum:
        - public
        - internal
        - sensitive
        - restricted
      risk_tier: &id018
        type: string
        enum:
        - T0
        - T1
        - T2
        - T3
        - T4
      quality_target:
        type: object
      cost_budget:
        type: object
      latency_budget:
        type: object
      acceptance_tests:
        type: array
        items: &id015
          type: object
          properties:
            test_id: *id001
            kind:
              type: string
              enum:
              - deterministic
              - execution
              - behavioral
              - human_blind
              - model_grader
              - market
              - policy
            command:
              type: string
            grader_ref:
              type: string
            pass_condition:
              type: string
            weight:
              type: number
              minimum: 0
          required:
          - test_id
          - kind
          - pass_condition
          additionalProperties: false
        minItems: 1
      escalation_conditions:
        type: array
        items: *id014
    required:
    - task_id
    - goal
    - primary_domain
    - task_family
    - required_outputs
    - hard_constraints
    - risk_tier
    - acceptance_tests
    additionalProperties: false
  Mission:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      mission_id: *id001
      intent: *id001
      strategic_reason: *id001
      verified_outcome_definition: *id001
      baseline:
        type: object
      human_authority_boundaries:
        type: array
        items: *id001
        minItems: 1
      project_overlay_ref:
        type: string
      task_ids:
        type: array
        items: *id001
        uniqueItems: true
      dependency_edges:
        type: array
        items: *id001
        uniqueItems: true
      status:
        type: string
        enum:
        - proposed
        - active
        - blocked
        - verifying
        - complete
        - failed
        - stopped
      human_minutes:
        type: number
        minimum: 0
      cost:
        type: object
      started_at: *id002
      completed_at: *id002
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - mission_id
    - intent
    - verified_outcome_definition
    - human_authority_boundaries
    - status
    additionalProperties: false
  Trace:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      trace_id: *id001
      mission_id: *id001
      task_id: *id001
      actor: *id001
      model_ref:
        type: string
      capability_versions:
        type: array
        items: *id001
      tool_versions:
        type: array
        items: *id001
      context_packet_hash:
        type: string
      started_at: *id002
      ended_at: *id002
      events:
        type: array
        items:
          type: object
          properties:
            event_id: *id001
            event_type: *id001
            occurred_at: *id002
            actor: *id001
            payload_ref:
              type: string
            payload_hash:
              type: string
            redaction_state:
              type: string
              enum:
              - none
              - redacted
              - pointer_only
          required:
          - event_id
          - event_type
          - occurred_at
          - actor
          additionalProperties: false
        minItems: 1
      artifacts:
        type: array
        items: *id003
      verification_refs:
        type: array
        items: *id003
      permission_decisions:
        type: array
        items: *id003
      human_intervention_refs:
        type: array
        items: *id003
      token_cost:
        type: object
      financial_cost:
        type: number
        minimum: 0
      latency_ms:
        type: integer
        minimum: 0
      final_status:
        type: string
        enum:
        - running
        - success
        - failure
        - escalated
        - rolled_back
      failure_stage:
        type: string
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - trace_id
    - mission_id
    - task_id
    - actor
    - started_at
    - events
    - final_status
    additionalProperties: false
  EvalCase:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      eval_case_id: *id001
      domain: *id001
      task_contract:
        $ref: '#/$defs/TaskContract'
      fixture_refs:
        type: array
        items: *id003
      expected_properties:
        type: object
      grader_spec:
        type: array
        items: *id015
        minItems: 1
      split:
        type: string
        enum:
        - train_example
        - dev
        - held_out
        - regression
        - adversarial
        - market
      leakage_controls:
        type: array
        items: *id001
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - eval_case_id
    - domain
    - task_contract
    - grader_spec
    - split
    additionalProperties: false
  EvalResult:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      eval_run_id: *id001
      target_ref: *id003
      baseline_ref:
        type: string
      eval_case_refs:
        type: array
        items: *id003
        minItems: 1
      scores:
        type: object
      pass_state:
        type: string
        enum:
        - pass
        - fail
        - inconclusive
      confidence_interval:
        type: object
      regressions:
        type: array
        items: *id001
      failures:
        type: array
        items: *id001
      cost:
        type: object
      executed_at: *id002
      grader_versions:
        type: array
        items: *id001
      raw_result_ref:
        type: string
    required:
    - object_id
    - object_type
    - version
    - semantic_owner
    - lifecycle_state
    - created_at
    - created_by
    - provenance_refs
    - eval_run_id
    - target_ref
    - eval_case_refs
    - scores
    - pass_state
    - executed_at
    additionalProperties: false
  VerificationResult:
    type: object
    properties:
      object_id: *id001
      object_type: *id001
      human_name: *id004
      version: *id005
      semantic_owner: *id001
      lifecycle_state: *id006
      created_at: *id002
      created_by: *id001
      updated_at: *id002
      provenance_refs: *id007
      parent_ids: *id008
      root_origin_id: *id003
      tags: *id009
      visibility: *id010
      content_ref: *id011
      content_hash: *id013
      status_reason: *id012
      verification_id: *id001
      task_id: *id001
      artifact_refs:
        type: array
        items: *id003
        minItems: 1
      acceptance_test_results:
        type: array
        items:
          type: object
          properties:
            test_id: *id001
            status:
              type: string
              enum:
              - pass
              - fail
              - blocked
            evidence_ref:
              type: string
            notes:
              type: string
          required:
          - test_id
          - status
          additionalProperties: false
        minItems: 1
      policy_violations:
        type: array
        items: *id001
      overall_status:
        type: string
        enum:
        - pass
        - fail
        - blocked
      verifier_actor: *id001
      verified_at: *id002
      independence_statement: *id001
    required:
    - object_id
    - object_type
