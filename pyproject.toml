[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jervis-architecture-slice"
version = "0.1.0"
description = "Runnable public slice of the Jervis learning and mission architecture"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "beautifulsoup4>=4.12,<5",
  "psutil>=6,<8",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ironman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
